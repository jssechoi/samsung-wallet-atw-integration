server:
  port: ${PORT:48080}
  # Listen on all interfaces so mobile devices on the same network can access (e.g. http://<your-pc-ip>:48080)
  address: 0.0.0.0
  # Trust X-Forwarded-* headers from Render (and other reverse proxies)
  forward-headers-strategy: framework

spring:
  application:
    name: samsung-wallet-atw-demo
  datasource:
    url: jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# Optional: base URL of this demo (for QR fallback when on localhost use ngrok URL; on Render set DEMO_BASE_URL to e.g. https://samsung-wallet-atw-demo.onrender.com).
demo:
  ngrok-base-url: ${DEMO_BASE_URL:}

# Samsung Wallet (optional – leave empty for in-memory demo keys)
samsung:
  wallet:
    # Demo default; for production set env var SAMSUNG_WALLET_PARTNER_ID
    partner-id: ${SAMSUNG_WALLET_PARTNER_ID:4123202943517138496}
    card-id: ${SAMSUNG_WALLET_CARD_ID:demo-card}
    # Demo default; for production set env var SAMSUNG_WALLET_CERTIFICATE_ID (certificateId is case-sensitive, default: dbR7)
    certificate-id: ${SAMSUNG_WALLET_CERTIFICATE_ID:dbR7}
    # Card IDs per type (for ATW links and Update Notification)
    card-id-ticket: 3iulq9hr93hg0
    card-id-boardingpass: 3iumevlevet00
    card-id-coupon: 3iumf1neuhjg0
    card-id-idcard: 3iumf2sua70g0
    # partner-private-key-path: /path/to/partner-private.pem
    # samsung-public-cert-path: /path/to/samsung-public.crt
    api-base-url: https://tsapi-card.walletsvc.samsung.com
    cc2: us
